services:
  db:
    image: postgres
    container_name: db
    restart: unless-stopped
    env_file:
      - ./db/.env
    volumes:
      - clankclub_data:/var/lib/postgresql

  backend:
    build: backend
    env_file:
      - backend/.env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: sh -c "sleep 5 && uv run fastapi run src/main.py --reload --host 0.0.0.0"

volumes:
  clankclub_data:
